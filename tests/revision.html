<!doctype html><html><head><meta charset="utf-8"><title>Portfolio responsive verification</title><style>body{margin:0}iframe{border:0;display:block}pre{white-space:pre-wrap}</style></head><body><pre id="results">Checking the four Figma layouts…</pre><script>
const cases=[{mode:'product',mobile:false,w:1512,h:982},{mode:'games',mobile:false,w:1512,h:982},{mode:'product',mobile:true,w:402,h:874},{mode:'games',mobile:true,w:402,h:874}];const results=[];let done=0;const params=new URLSearchParams(location.search);const selected=params.get('mode');const single=params.has('single');
for(const c of (single?cases.filter(c=>c.mobile&&c.mode===selected):cases)){
const frame=document.createElement('iframe');frame.width=c.w;frame.height=c.h;frame.title=c.mode+(c.mobile?' mobile':' desktop');frame.src='../index.html?mode='+c.mode;document.body.insertBefore(frame,document.querySelector('pre'));
frame.onload=async()=>{try{const w=frame.contentWindow,d=frame.contentDocument;const check=(label,pass)=>results.push({layout:frame.title,label,pass:!!pass});const b=s=>d.querySelector(s).getBoundingClientRect();await d.fonts.ready;const visible=c.mode==='games'?'.dark-world':'.light-world';d.querySelectorAll(visible+' img').forEach(i=>i.loading='eager');await Promise.all([...d.querySelectorAll(visible+' img')].map(i=>i.decode().catch(()=>{})));
check('mode matches URL',d.documentElement.dataset.mode===c.mode);check('no document overflow',d.documentElement.scrollWidth===c.w);check('header has counter and Visitor Gallery',b('.switch-counter').width>0&&b('.visitor-gallery-button').width>0);check('header controls do not overlap',b('.switch-counter').right<b('.visitor-gallery-button').left);check('correct header inset',Math.abs(b('.switch-counter').left-(c.mobile?14:20))<1);check('all artwork loaded',[...d.querySelectorAll(visible+' img')].every(i=>i.complete&&i.naturalWidth>0));check('footer matches reference',Math.abs(b('footer').top-(c.mobile?813:907))<1);const sel=c.mode==='games'?'.dark-project-one':'.light-project-one';const expected=c.mobile?(c.mode==='games'?[469,506]:[438,485]):(c.mode==='games'?[723,638]:[698,631]);check('first project matches Figma x/width',Math.abs(b(sel).left-expected[0])<1&&Math.abs(b(sel).width-expected[1])<1);
if(c.mobile){check('name sits above footer',b('.name').top<b('footer').top);check('index sits above footer',b('.light-piece-next').top<b('footer').top);check('correct mobile switch source',d.querySelector(c.mode==='games'?'.dark-figma-switch img':'.figma-switch img').currentSrc.includes(c.mode==='games'?'imgSwitch3':'imgSwitch2'))}
d.querySelector('.visitor-gallery-button').click();check('Visitor Gallery opens pending-content dialog',d.querySelector('#visitor-dialog').open);d.querySelector('.visitor-close').click();check('Visitor Gallery closes',!d.querySelector('#visitor-dialog').open);const g=d.querySelector('.gallery');g.dispatchEvent(new KeyboardEvent('keydown',{key:'End',bubbles:true}));await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));check('index follows project count',d.querySelector('#light-piece-index').textContent===(c.mode==='games'?'04 / 04':'03 / 03'));check('header stays fixed while scrolling',Math.abs(b('.switch-counter').left-(c.mobile?14:20))<1);check('no vertical displacement',Math.abs(b(c.mode==='games'?'.dark-canvas':'.light-canvas').top)<1);
d.querySelector('.mode-switch').click();check('switch changes gallery',d.documentElement.dataset.mode!==c.mode);d.querySelector('.mode-switch').click();check('switch returns to starting gallery',d.documentElement.dataset.mode===c.mode);g.scrollTo({left:0});
}catch(e){results.push({layout:frame.title,label:String(e),pass:false})}finally{done++;document.querySelector('#results').textContent=results.map(r=>(r.pass?'PASS ':'FAIL ')+r.layout+': '+r.label).join('\n');document.body.dataset.complete=String(done);document.body.dataset.failures=String(results.filter(r=>!r.pass).length)}}}
</script></body></html>
