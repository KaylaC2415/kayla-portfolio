<!doctype html><html><head><meta charset="utf-8"><title>Playground motion verification</title><style>body{margin:0;background:#05040f;color:white}iframe{border:0;display:block}</style></head><body><iframe src="../index.html?mode=games" width="1512" height="982" title="Dark Playground animation"></iframe><pre id="results">Checking…</pre><script>
const f=document.querySelector('iframe');if(new URLSearchParams(location.search).has('mobile')){f.width=402;f.height=874}f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument;await d.fonts.ready;const result=[];const check=(label,pass)=>result.push((pass?'PASS ':'FAIL ')+label);const button=d.querySelector('.dark-playground-button'),track=d.querySelector('.pg-track'),arrows=d.querySelector('.pg-arrows'),slot=d.querySelector('.pg-arrows-slot'),gallery=d.querySelector('.gallery');const wait=ms=>new Promise(r=>setTimeout(r,ms));const matrix=e=>new DOMMatrix(w.getComputedStyle(e).transform);const section=d.querySelector('.dark-playground');gallery.scrollLeft=section.getBoundingClientRect().left+gallery.scrollLeft-50;const defaultRect=arrows.getBoundingClientRect();check('One accessible Playground action',d.querySelectorAll('.dark-playground-button').length===1&&button.getAttribute('aria-label')==='Enter my Playground');check('Default title at rest',matrix(track).m42===0);check('Pink and lime SVG assets load',await Promise.all([...d.querySelectorAll('.pg-arrows img')].map(i=>i.decode().then(()=>i.naturalWidth===267).catch(()=>false))).then(v=>v.every(Boolean)));button.focus();await wait(800);const step=parseFloat(w.getComputedStyle(section).getPropertyValue('--pg-step'));check('Title completes vertical flip',Math.abs(matrix(track).m42+step)<1);check('Lime arrows fully visible',Number(w.getComputedStyle(d.querySelector('.pg-arrows-lime')).opacity)>.999);check('Arrows move to right edge',Math.abs(arrows.getBoundingClientRect().right-slot.getBoundingClientRect().right)<1);check('Arrows moved right',arrows.getBoundingClientRect().left>defaultRect.left);check('Button title is not clipped horizontally',d.querySelector('.pg-row').scrollWidth<=d.querySelector('.pg-row').clientWidth+1);button.blur();await wait(800);check('Title returns on exit',Math.abs(matrix(track).m42)<1);check('Arrows return on exit',Math.abs(arrows.getBoundingClientRect().left-defaultRect.left)<1);check('Playground links to shared page',button.tagName==='A'&&new URL(button.href).pathname.endsWith('/playground.html'));button.blur();await wait(800);document.querySelector('#results').textContent=result.join('\n');document.body.dataset.failures=String(result.filter(r=>r.startsWith('FAIL')).length)};
</script></body></html>
