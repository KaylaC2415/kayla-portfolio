<!doctype html><meta charset="utf-8"><title>Light Playground ticket preview</title><style>body{margin:0}iframe{display:block;border:0}pre{margin:0}</style><pre id="results">Checking…</pre><script>(async()=>{const results=[];for(const width of [829,402]){const f=document.createElement('iframe');f.width=width;f.height=767;f.src='../?mode=product';f.setAttribute('aria-hidden','true');document.body.append(f);await new Promise(r=>f.onload=r);const d=f.contentDocument,w=f.contentWindow;await d.fonts.ready;const main=d.querySelector('#gallery'),ticket=d.querySelector('.playground-ticket');main.scrollLeft+=ticket.getBoundingClientRect().left-width*.2;results.push({width,holes:ticket.querySelectorAll('.ticket-holes i').length,background:w.getComputedStyle(ticket).backgroundColor,assets:[...ticket.querySelectorAll('img')].map(x=>({src:x.getAttribute('src'),loaded:x.complete&&x.naturalWidth>0})),link:ticket.getAttribute('href'),size:[ticket.offsetWidth,ticket.offsetHeight]})}document.querySelector('pre').textContent=JSON.stringify(results)})();</script>
