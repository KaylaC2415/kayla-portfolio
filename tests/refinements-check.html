<!doctype html><meta charset="utf-8"><title>Portfolio refinements check</title><style>iframe{display:block;border:0}pre{white-space:pre-wrap}</style><pre id="results">Checking…</pre><script>
(async()=>{let results=[];for(const size of [[972,767],[402,874]]){let visitors=[];for(const page of ['../?mode=product','../?mode=games','../playground.html']){const f=document.createElement('iframe');f.width=size[0];f.height=size[1];f.src=page;document.body.append(f);await new Promise(r=>f.onload=r);const w=f.contentWindow,d=f.contentDocument;await d.fonts.ready;await new Promise(r=>setTimeout(r,100));const v=d.querySelector('.visitor-gallery-button,.visitor-button'),rect=v.getBoundingClientRect();visitors.push({right:size[0]-rect.right,top:rect.top,width:rect.width,height:rect.height,font:w.getComputedStyle(v).fontSize});results.push({page,size,nameNotLinked:!d.querySelector('a.site-footer-name')});if(page.includes('games')){const link=d.querySelector('.dark-playground');results.push({fullBlockLink:link.tagName==='A'&&!!link.querySelector('.pg-arrows-slot')&&!!link.querySelector('p'),greenSwitch:d.querySelector('.dark-figma-switch img').getAttribute('src').includes('switch-green'),gap:w.getComputedStyle(link.querySelector('p')).marginBottom})}if(page.includes('playground')){results.push({size,mobileNameHidden:size[0]>700||w.getComputedStyle(d.querySelector('.play-name')).display==='none',categories:[...d.querySelectorAll('.category')].map(x=>({category:x.dataset.categoryLink,src:x.querySelector('img').getAttribute('src'),weight:w.getComputedStyle(x.querySelector('.category-label')).fontWeight,shadow:w.getComputedStyle(x.querySelector('.category-art')).filter}))})}}results.push({size,visitors,positionsMatch:visitors.every(v=>Math.abs(v.right-visitors[0].right)<.1&&Math.abs(v.top-visitors[0].top)<.1&&Math.abs(v.width-visitors[0].width)<.1&&Math.abs(v.height-visitors[0].height)<.1)})}document.querySelector('pre').textContent=JSON.stringify(results,null,2)})();
</script>
