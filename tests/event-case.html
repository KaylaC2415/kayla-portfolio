<!doctype html><html><head><meta charset="utf-8"><title>Event case study verification</title><style>body{margin:0}iframe{display:block;border:0}pre{white-space:pre-wrap}</style></head><body><iframe src="../event-content-workspace.html" title="Case study mobile layout" width="390" height="844"></iframe><pre id="results">Checking…</pre><script>
const f=document.querySelector('iframe');const desktop=new URLSearchParams(location.search).has('desktop');if(desktop){f.width=1280;f.height=900;f.title='Case study desktop layout'}f.onload=async()=>{const d=f.contentDocument,w=f.contentWindow,results=[];const check=(label,pass)=>results.push((pass?'PASS ':'FAIL ')+label);await d.fonts.ready;d.querySelectorAll('img').forEach(i=>i.loading='eager');await Promise.all([...d.images].map(i=>i.decode().catch(()=>{})));check('No horizontal page overflow',d.documentElement.scrollWidth===w.innerWidth);check('Eight original chapters',d.querySelectorAll('.case-section').length===8);check('One page title',d.querySelectorAll('h1').length===1);check('All 12 image placements loaded',[...d.images].length===12&&[...d.images].every(i=>i.complete&&i.naturalWidth>0));check('All chapter links resolve',[...d.querySelectorAll('.case-outline a')].every(a=>d.querySelector(a.hash)));check('Both return links target Product gallery',[...d.querySelectorAll('[data-gallery-return]')].length===2&&[...d.querySelectorAll('[data-gallery-return]')].every(a=>a.search.includes('mode=product')));const source=await fetch('../case-content/event-content-workspace.json').then(r=>r.json());const text=d.querySelector('main').textContent.replace(/\s+/g,' ');const expected=source.sections.flatMap(s=>s.blocks).filter(b=>b.text).map(b=>b.text.replace(/\s+/g,' '));check('Every source text block retained',expected.every(t=>text.includes(t)));const videos=[...d.querySelectorAll('video')];check('Three playable videos with native controls',videos.length===3&&videos.every(v=>v.controls));const media=await Promise.all(videos.map(v=>new Promise(resolve=>{v.preload='metadata';v.addEventListener('loadedmetadata',()=>resolve(v.duration>0),{once:true});v.addEventListener('error',()=>resolve(false),{once:true});v.load();setTimeout(()=>resolve(false),12000)})));check('All three local videos have valid metadata',media.every(Boolean));check('Case images remain within viewport',[...d.images].every(i=>i.getBoundingClientRect().right<=w.innerWidth+1));document.querySelector('#results').textContent=results.join('\n');document.body.dataset.failures=results.filter(s=>s.startsWith('FAIL')).length};
</script></body></html>
