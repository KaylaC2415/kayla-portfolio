<!doctype html><meta charset="utf-8"><title>Case grid and note verification</title><style>body{margin:0}iframe{display:block;border:0}pre{white-space:pre-wrap;margin:0}</style><pre id="results">Checking…</pre><script>(async()=>{const results=[];for(const width of [840,402]){const f=document.createElement('iframe');f.width=width;f.height=767;f.src='../five-mics-central.html';f.setAttribute('aria-hidden','true');document.body.append(f);await new Promise(r=>f.onload=r);const d=f.contentDocument,w=f.contentWindow;await d.fonts.ready;const n=d.querySelector('.fmc-note-number'),title=d.querySelector('.fmc-production-meta dt'),meta=d.querySelector('.fmc-production-meta'),style=w.getComputedStyle(n);w.scrollTo({top:meta.getBoundingClientRect().top+w.scrollY-440,behavior:'instant'});results.push({width,gridGap:w.getComputedStyle(d.querySelector('.screen-grid')).gap,number:{fill:style.backgroundColor,border:style.borderTop,radius:style.borderRadius},titleWeight:w.getComputedStyle(title).fontWeight,titleAlign:w.getComputedStyle(title).alignItems,bodyLineHeight:w.getComputedStyle(d.querySelector('.fmc-production-meta dd')).lineHeight,overflow:d.documentElement.scrollWidth>width})}document.querySelector('pre').textContent=JSON.stringify(results)})();</script>
