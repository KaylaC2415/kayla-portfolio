<!doctype html><meta charset="utf-8"><title>Footer and fixed room verification</title><style>iframe{display:block;border:0}pre{white-space:pre-wrap}</style><pre id="results">Checking…</pre><script>
(async()=>{let results=[];for(const size of [[998,767],[402,874]]){let names=[];for(const page of ['../?mode=product','../?mode=games','../playground.html']){const f=document.createElement('iframe');f.width=size[0];f.height=size[1];f.src=page;document.body.append(f);await new Promise(r=>f.onload=r);const w=f.contentWindow,d=f.contentDocument;await d.fonts.ready;await new Promise(r=>setTimeout(r,100));const name=d.querySelector('.site-footer-name').getBoundingClientRect();names.push({left:name.left,bottom:size[1]-name.bottom});const index=d.querySelector('.site-footer-index');if(index){const right=size[0]-index.getBoundingClientRect().right;results.push({page,size,padding:name.left,right,pass:Math.abs(name.left-right)<.1})}else{const s=w.getComputedStyle(d.body),canvas=w.getComputedStyle(d.querySelector('.play-canvas'));const main=d.querySelector('main');main.scrollLeft=1600;await new Promise(r=>setTimeout(r,100));results.push({page,size,fixed:s.backgroundAttachment,repeat:s.backgroundRepeat,canvas:canvas.backgroundImage,pass:s.backgroundAttachment==='fixed'&&s.backgroundRepeat==='no-repeat'&&canvas.backgroundImage==='none'});for(const category of d.querySelectorAll('.category')){const active=category.hasAttribute('aria-current');results.push({category:category.dataset.categoryLink,active,pass:category.querySelector('img').getAttribute('src').includes(active?'category-active.svg':'desktop-imgHouse.svg')&&w.getComputedStyle(category).filter==='none'})}}}results.push({size,names,pass:names.every(n=>Math.abs(n.left-names[0].left)<.1&&Math.abs(n.bottom-names[0].bottom)<.1)})}document.querySelector('pre').textContent=JSON.stringify(results,null,2)})();
</script>
