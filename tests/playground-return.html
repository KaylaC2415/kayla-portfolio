<!doctype html><html><head><meta charset="utf-8"><title>Playground origin return verification</title><style>body{margin:0}iframe{display:block;border:0}pre{white-space:pre-wrap}</style></head><body><pre id="results">Checking…</pre><script>
const results=[],cases=[['product',false],['games',false],['product',true],['games',true]];let done=0;
for(const [mode,mobile]of cases){const f=document.createElement('iframe');f.width=mobile?402:1512;f.height=mobile?874:982;f.title=mode+(mobile?' mobile':' desktop');let phase=0,left=0;const check=(label,pass)=>results.push((pass?'PASS ':'FAIL ')+f.title+': '+label);f.onload=async()=>{const d=f.contentDocument,w=f.contentWindow;await d.fonts.ready;await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));if(phase===0){const g=d.querySelector('.gallery');const entry=d.querySelector(mode==='games'?'.dark-playground-button':'.playground-sign');g.scrollLeft=entry.getBoundingClientRect().left+g.scrollLeft-24;await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));left=g.scrollLeft;check('Playground is a native link',entry.tagName==='A');phase=1;entry.click()}else if(phase===1){check('Both modes reach the same Playground',w.location.pathname.endsWith('/playground.html')&&d.querySelectorAll('.play-work').length===9);check('Origin mode passed correctly',new URLSearchParams(w.location.search).get('from')===mode);check('Return token retained',Boolean(new URLSearchParams(w.location.search).get('return')));phase=2;d.querySelector('[data-gallery-return]').click()}else if(phase===2){check('Correct gallery mode restored',d.documentElement.dataset.mode===mode);check('Original gallery position restored',Math.abs(d.querySelector('.gallery').scrollLeft-left)<1);done++;document.querySelector('#results').textContent=results.join('\n');document.body.dataset.complete=done;document.body.dataset.failures=results.filter(r=>r.startsWith('FAIL')).length}};f.src='../?mode='+mode;document.body.insertBefore(f,document.querySelector('pre'))}
</script></body></html>
