<!doctype html><html><head><meta charset="utf-8"><title>Gallery return verification</title></head><body><iframe title="Mobile case study navigation" width="390" height="844" src="../?mode=product&project=event-content-workspace"></iframe><pre id="results">Checking…</pre><script>const f=document.querySelector('iframe');let phase=0,left=0;const results=[];f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument;await d.fonts.ready;await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));if(phase===0){left=d.querySelector('#gallery').scrollLeft;results.push((left>0?'PASS ':'FAIL ')+'Starts at Event Content Workspace');phase=1;d.querySelector('.project-cover-link').click()}else if(phase===1){results.push((d.querySelector('#case-title')?.textContent==='Event Content Workspace'?'PASS ':'FAIL ')+'Gallery image opens the right case study');phase=2;d.querySelector('[data-gallery-return]').click()}else if(phase===2){const restored=d.querySelector('#gallery').scrollLeft;results.push((Math.abs(restored-left)<1?'PASS ':'FAIL ')+`Mobile gallery position restored (${left} → ${restored})`);results.push((d.documentElement.dataset.mode==='product'?'PASS ':'FAIL ')+'Product mode restored');document.querySelector('#results').textContent=results.join('\n')}};</script></body></html>
