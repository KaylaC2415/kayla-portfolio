<!doctype html><html><head><meta charset="utf-8"><title>Portfolio verification</title></head><body style="margin:0;background:#ddd"><iframe title="Portfolio preview" src="../index.html" style="width:1512px;height:982px;border:0;display:block"></iframe><pre id="results">Running…</pre><script>
const frame=document.querySelector('iframe');const params=new URLSearchParams(location.search);const mobile=params.has('mobile');if(mobile){frame.style.width='390px';frame.style.height='844px'}
frame.onload=async()=>{const w=frame.contentWindow,d=frame.contentDocument;const results=[];const wait=ms=>new Promise(r=>setTimeout(r,ms));const check=(label,value)=>results.push({label,pass:!!value});const box=s=>d.querySelector(s).getBoundingClientRect();await d.fonts.ready;d.querySelectorAll('.light-world img').forEach(img=>img.loading='eager');await Promise.all([...d.querySelectorAll('.light-world img,.figma-switch img')].map(img=>img.decode().catch(()=>{})));check('All 11 Figma assets loaded',[...d.querySelectorAll('.light-world img,.figma-switch img')].every(i=>i.complete&&i.naturalWidth>0));check('Light mode starts',d.documentElement.dataset.mode==='product');check('Document does not overflow',d.documentElement.scrollWidth===w.innerWidth);if(!mobile){const cover=box('.light-project-one');check('First cover matches Figma position',Math.abs(cover.left-698)<1&&Math.abs(cover.top-325)<1&&Math.abs(cover.width-631)<1);check('Second cover matches Figma',Math.abs(box('.light-project-two').left-1448)<1&&Math.abs(box('.light-project-two').top-61)<1);check('Footer matches Figma',Math.abs(box('footer').top-907)<1);check('Ribbon matches native exported size',Math.abs(box('.light-ribbon').width-4503)<1)}else{check('True mobile viewport',w.innerWidth===390);const n=box('.name'),t=box('.mode-switch'),i=box('.light-piece-next');check('Fixed footer controls do not overlap',n.right<t.left&&t.right<i.left);check('Opening fits mobile',box('.light-intro').right<=390);check('Gallery remains horizontal',d.querySelector('.gallery').scrollWidth>390)}const footerBefore=box('footer');d.querySelector('.scroll-sign').click();await wait(800);check('Scroll button advances',d.querySelector('.gallery').scrollLeft>100);check('Footer stays fixed while scrolling',box('footer').top===footerBefore.top);const toggle=d.querySelector('.mode-switch');toggle.click();check('Switch enables dark mode',d.documentElement.dataset.mode==='games'&&toggle.getAttribute('aria-checked')==='true');check('Light gallery hidden in dark mode',getComputedStyle(d.querySelector('.light-world')).display==='none');check('Refined dark gallery shown',getComputedStyle(d.querySelector('.dark-world')).display==='block');toggle.click();check('Switch returns to Figma light mode',d.documentElement.dataset.mode==='product');check('Switch count increments',Number(d.querySelector('#switch-total').textContent)>=2);check('Mode URL updates',w.location.search==='?mode=product');d.querySelector('.playground-sign').click();check('Playground preview opens',d.querySelector('dialog').open);d.querySelector('.close').click();check('Preview closes',!d.querySelector('dialog').open);const gallery=d.querySelector('.gallery');gallery.scrollLeft=gallery.scrollWidth;await wait(150);check('Index counts three projects',d.querySelector('#light-piece-index').textContent==='03 / 03');gallery.scrollLeft=0;await wait(100);document.querySelector('#results').textContent=results.map(x=>(x.pass?'PASS ':'FAIL ')+x.label).join('\n');document.body.dataset.failures=results.filter(x=>!x.pass).length};
</script></body></html>
