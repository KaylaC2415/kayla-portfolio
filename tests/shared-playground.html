<!doctype html><html><head><meta charset="utf-8"><title>Shared Playground verification</title><style>body{margin:0}iframe{display:block;border:0}pre{white-space:pre-wrap}</style></head><body><iframe src="../playground.html?from=games" title="Shared Playground reference layout" width="1512" height="982"></iframe><pre id="results">Checking…</pre><script>
const f=document.querySelector('iframe'),mobile=new URLSearchParams(location.search).has('mobile');if(mobile){f.width=402;f.height=874}f.onload=async()=>{const d=f.contentDocument,w=f.contentWindow,results=[];const check=(label,pass)=>results.push((pass?'PASS ':'FAIL ')+label);const wait=ms=>new Promise(r=>setTimeout(r,ms));await d.fonts.ready;const images=[...d.querySelectorAll('.work-image')];images.forEach(i=>i.loading='eager');await Promise.all(images.map(i=>new Promise(r=>{if(i.complete&&i.naturalWidth)return r();i.addEventListener('load',r,{once:true});i.addEventListener('error',r,{once:true});setTimeout(r,12000)})));const rect=s=>d.querySelector(s).getBoundingClientRect();check('All nine desktop projects are present',d.querySelectorAll('.play-work').length===9);check('All artwork images loaded',images.every(i=>i.complete&&i.naturalWidth>0));check('No document overflow',d.documentElement.scrollWidth===w.innerWidth);check('First frame matches Figma x/y/size',Math.abs(rect('.work-frame').left-(mobile?37:136))<1&&Math.abs(rect('.work-frame').top-(mobile?158:191))<1&&Math.abs(rect('.work-frame').width-(mobile?485:592))<1&&Math.abs(rect('.work-frame').height-(mobile?273:333))<1);check('Correct Figma room background',w.getComputedStyle(d.querySelector('.play-canvas')).backgroundImage.includes(mobile?'mobile-imgLightModeMobile':'desktop-imgPlaygroundDesktop'));check('Four category links',d.querySelectorAll('[data-category-link]').length===4);check('Back link keeps origin mode',new URL(d.querySelector('[data-gallery-return]').href).searchParams.get('mode')==='games');check('Native SVG assets loaded',[...d.querySelectorAll('picture img')].every(i=>i.complete&&i.naturalWidth>0));if(mobile){check('Mobile categories stay above artworks',rect('.category-nav').bottom<rect('.work-frame').top);check('Mobile current category visible',rect('.current-category').width>0);check('Mobile nav scrolls to all four categories',d.querySelector('.category-nav').scrollWidth>d.querySelector('.category-nav').clientWidth)}check('GIFs have paused poster canvases',[...d.querySelectorAll('.animation-still')].length===3&&[...d.querySelectorAll('.animation-still')].every(c=>c.width>0&&c.height>0));const originalHeader=rect('.play-header').top;d.querySelector('[data-category-link="motions"]').click();await wait(1800);check('Motions category navigation works',d.querySelector('[aria-current="location"]').dataset.categoryLink==='motions');check('Category updates URL',w.location.hash==='#motions');check('Header remains fixed',rect('.play-header').top===originalHeader);d.querySelector('[data-view-project="8"]').click();check('Image viewer opens correct project',d.querySelector('#project-viewer').open&&d.querySelector('#viewer-title').textContent==='Five Mics Content Design');d.querySelector('#project-viewer .dialog-close').click();check('Image viewer closes',!d.querySelector('#project-viewer').open);d.querySelector('[data-view-project="5"]').click();await wait(150);check('Game viewer offers animation control',!d.querySelector('#animation-toggle').hidden);d.querySelector('#animation-toggle').click();check('Game animation can play',d.querySelector('#animation-toggle').textContent==='Pause animation');d.querySelector('#animation-toggle').click();check('Game animation can pause',d.querySelector('#animation-toggle').textContent==='Play animation');d.querySelector('#project-viewer .dialog-close').click();d.querySelector('.visitor-button').click();check('Visitor Gallery pending-content dialog works',d.querySelector('#visitor-dialog').open);d.querySelector('#visitor-dialog .dialog-close').click();d.querySelector('[data-category-link="ui-ux"]').click();await wait(1800);check('Return to first category',d.querySelector('[aria-current="location"]').dataset.categoryLink==='ui-ux');document.querySelector('#results').textContent=results.join('\n');document.body.dataset.failures=results.filter(r=>r.startsWith('FAIL')).length};
</script></body></html>
